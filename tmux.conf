display-message "MY TMUX CONFIG LOADED"
set -g history-limit 10000

# True color setting
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys"

# Propagate events outside tmux
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format xterm

# Pane borders — thicker lines + high-contrast colors
set -g pane-border-lines double
set -g pane-border-style "fg=#5a5200"
set -g pane-active-border-style "fg=#ffee00,bold"
